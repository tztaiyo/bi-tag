<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12264a"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>受入・検査 管理画面</title><style>:root{
  --ink:#152131; --ink2:#465467; --mute:#7a8696; --line:#dde2e8; --bg:#f2f4f7; --card:#fff;
  --navy:#12264a; --accent:#1d5fc4; --accent-soft:#e6eefb;
  --s-unacc:#6b7480; --s-uninsp:#1d5fc4; --s-done:#15803d; --s-hold:#b45309;
  --pri:#d21f1f; --pri-soft:#fde8e8; --ok:#15803d; --ok-soft:#e5f5ea; --warn:#b45309; --warn-soft:#fff3df;
  --g:#1a73e8;
  --r:10px;
  --f:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --mono:"BIZ UDGothic",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--f);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
a{color:var(--accent);text-decoration:none}
button{font:inherit}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums} .mute{color:var(--mute)} .small{font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row.end{justify-content:flex-end;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #c7cdd6;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover{background:#f4f6f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#a21b1b;border-color:#efb1b1}
.btn.red{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{padding:13px 22px;font-size:16px;font-weight:700}
.btn:disabled{opacity:.5}
input[type=text],input[type=search],input[type=number],select{font:inherit;border:1px solid #c7cdd6;border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #9ec1ff;border-color:var(--accent)}
.st{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.st-未受入{background:var(--s-unacc)} .st-未検査{background:var(--s-uninsp)} .st-検査済{background:var(--s-done)} .st-保留{background:var(--s-hold)}
.pri{display:inline-block;background:var(--pri);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.pri.alert{background:#7a1010}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa6af;margin-right:5px;vertical-align:1px}
.dot.on{background:#34c472}.dot.warn{background:#f0a020}.dot.bad{background:#e03a3a}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:90;max-width:92vw;pointer-events:none}
.toast.on{opacity:1}.toast.bad{background:#a21b1b}
.dlg-back{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.dlg-msg{font-size:15px;line-height:1.6}
.dlg input{width:100%;margin-top:10px}
/* ログイン */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body.login-page{background:linear-gradient(160deg,#12264a 0%,#1d3d72 100%)}
.lcard{background:#fff;border-radius:16px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);display:grid;gap:12px}
.lbrand{font-size:21px;font-weight:700}.lsub{color:var(--mute);font-size:12px;letter-spacing:.12em;margin-top:-10px}
.lcard p{margin:0;color:var(--ink2)}
.fl{display:grid;gap:4px;font-size:12px;color:var(--ink2);font-weight:700}
.loginmsg{color:#a21b1b;font-size:13px;min-height:1em;white-space:pre-wrap}
/* 管理アプリ(PC) */
body.admin{background:var(--bg)}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 max(20px,env(safe-area-inset-left,0px));height:54px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;white-space:nowrap}.brand small{display:block;font-weight:400;font-size:10.5px;opacity:.7;letter-spacing:.1em}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav a{color:#c4cfe0;padding:17px 12px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a.on{color:#fff;border-bottom-color:#7fb0ff}
.topst{font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.topst .btn{padding:3px 10px;font-size:12px}
.wrap{max-width:1400px;margin:0 auto;padding:18px max(20px,env(safe-area-inset-left,0px))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:21px;margin:0}h2{font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flush{padding:0;overflow-x:auto}
.card.flush h2{padding:14px 16px 0}
.sect{margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.empty{padding:26px;text-align:center;color:var(--mute)}
.welcome{text-align:center;padding:40px 20px;display:grid;gap:12px;justify-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink2);background:#f7f8fa;white-space:nowrap}
.tbl tr.prirow td:first-child{box-shadow:inset 4px 0 var(--pri)}
.tbl tr.warnrow{background:var(--pri-soft)}
.kv th{width:130px;font-size:12px;color:var(--ink2);text-align:left;padding:7px 10px 7px 0;vertical-align:top}.kv td{padding:7px 0}
.ok{color:var(--ok);font-weight:700}

/* 通信の流れ */
.flowcard{background:#0f1d36;border-radius:14px;padding:16px 20px;margin-bottom:14px;color:#fff}
.flow{display:grid;grid-template-columns:200px 1fr 220px 1fr 200px;align-items:center;gap:0}
.fnode{border-radius:12px;padding:12px 14px;background:#1b2d4e;border:2px solid #2e4570;min-height:84px;transition:.2s}
.fnode.dev{border-color:#2f8f5b}.fnode.g{border-color:#3d7be0;text-align:center}.fnode.pc{border-color:#c9a64a;text-align:right}
.fnode.hit{animation:hit .6s}
@keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.fn-t{font-weight:700;font-size:14px}.fn-s{font-size:11.5px;color:#9fb1d0;margin-top:3px}
.fdev{font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane{position:relative;height:84px;display:flex;align-items:center}
.lane::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:2px dashed #3a5585}
.lane>span{position:absolute;left:0;right:0;top:calc(50% + 8px);text-align:center;font-size:11px;color:#8ea3c7}
.packet{position:absolute;left:0;top:calc(50% - 14px);background:#34c472;color:#05210f;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.4);font-family:var(--mono)}
.packet.p{background:#ff4d4d;color:#fff}.packet.a{background:#ffd34d;color:#3b2b00}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-left:6px solid var(--s-unacc);border-radius:var(--r);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.kpi b{font-size:30px;font-variant-numeric:tabular-nums}
.kpi.k-未検査{border-left-color:var(--s-uninsp)}.kpi.k-検査済{border-left-color:var(--s-done)}.kpi.k-保留{border-left-color:var(--s-hold)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.dside{display:grid;gap:14px}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}.flow{grid-template-columns:1fr;gap:6px}.lane{height:40px}}
/* 置き場マップ */
.lgroup{margin-bottom:14px}.lg-t{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.lbox{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfc;min-height:70px;display:grid;gap:5px;align-content:start}
.lbox.pz{border:2px solid var(--pri);background:#fff8f8}
.lb-h{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.lb-h span{font-size:12px;color:var(--mute)}
.lb-e{font-size:12px;color:#b3bac5}
.cbox{border:1px solid #e3c98f;border-left:4px solid #e0a93a;border-radius:8px;background:#fffdf6;padding:6px;display:grid;gap:4px}
.cbox.pz{border-color:var(--pri);border-left-color:var(--pri);background:#fff6f6}
.cbox.fresh{animation:fresh 2.2s ease-out}
.cb-h{display:flex;gap:6px;align-items:center;font-size:12.5px}.cb-k{font-size:10.5px;font-weight:700;color:#9a6b12;background:#fbecc8;border-radius:4px;padding:0 5px}
.cbox.pz .cb-k{color:#fff;background:var(--pri)}.cb-n{margin-left:auto;font-size:11px;color:var(--mute)}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}
.chip span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.p{border-color:var(--pri);background:var(--pri-soft)}
.chip.fresh{animation:fresh 2.2s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 4px #34c472;transform:scale(1.04)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.unpl{display:flex;flex-wrap:wrap;gap:6px}.unpl .chip{width:230px}
/* 通信モニター */
.feed{display:grid;gap:0;max-height:430px;overflow:auto}
.fr{display:grid;grid-template-columns:62px 1fr;gap:1px 8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.fr-t{color:var(--mute);font-variant-numeric:tabular-nums}.fr-d{font-size:11px;color:var(--ink2);font-weight:700}
.fr-w{grid-column:2}.fr-m{grid-column:2;font-size:11px;color:var(--mute)}
.fr.out .fr-d{color:#a0670a}
.fr.p{background:linear-gradient(90deg,var(--pri-soft),transparent)}
.fr.new{animation:frnew 1.6s ease-out}
@keyframes frnew{0%{background:#d7f5e3}100%{background:transparent}}
/* アラート */
.almodal{max-width:520px;padding:0;overflow:hidden}
.al-top{background:var(--pri);color:#fff;padding:14px 20px;font-weight:700;font-size:17px;display:flex;justify-content:space-between}
.al-body{padding:16px 20px;display:grid;gap:12px}
.al-body select{font-size:16px;font-weight:700;font-family:var(--mono)}
.al-where{background:#f6f7f9;border-radius:8px;padding:10px 12px}
.al-st{background:var(--ok-soft);border-radius:8px;padding:10px 12px;color:#0d4f2a;font-weight:700;display:grid;gap:4px}
.al-st .waiting{color:var(--ink2);font-weight:400;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.almodal .row.end{padding:0 20px 18px;margin-top:0}
.hlist{max-height:300px;overflow:auto;margin-top:10px;font-size:13px;display:grid;gap:4px}
/* 印刷用のタグ */
.printarea{display:none}
@media print{
  body.printing>*:not(.printarea){display:none!important}
  body.printing .printarea{display:grid;grid-template-columns:repeat(3,62mm);gap:4mm;padding:6mm}
  .ptag{border:1px dashed #888;border-radius:3mm;padding:3mm;display:grid;grid-template-columns:24mm 1fr;gap:3mm;align-items:center;height:36mm;break-inside:avoid}
  .ptag.p{border:2.5px solid #d21f1f}
  .pq svg{width:24mm;height:24mm}
  .pk{font-size:7pt;color:#555}.pn{font-size:12pt;font-weight:700;word-break:break-all}.pm{font-size:8pt}.pl{font-size:7.5pt;color:#333}
  .pp{display:inline-block;background:#d21f1f;color:#fff;font-size:8pt;font-weight:700;padding:0 2mm;border-radius:1mm;margin-top:1mm}
}
.chip.ng{border:2px dashed var(--pri);background:#fff0f0}
/* 読みやすさ: PCも文字を大きめに */
.chip{font-size:14px}.lg-t{font-size:14px}.lb-h span{font-size:13.5px}.cb-h{font-size:14px}
.fr{font-size:15px}.tbl{font-size:15px}.kpi div{font-size:15px}
.toast{font-size:16px}
</style></head>

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {

/* ---------------- タグの形式(QRの中身) ----------------
   部品タグ: BI-T;ID=T0001;PN=IHF-30112-A;LOT=L2610-03;Q=12;P=1   (P=1 なら発行時点で優先)

  for (const t of Object.values(masters.tags)) Object.assign(item(t.tag), { part: t.part, name: t.name, lot: t.lot, qty: t.qty, pri: t.pri, priSrc: t.pri ? 'タグ' : '' });
  for (const c of Object.keys(masters.carts || {})) cart(c);

function feedRow(f) {
  const e = f.e, d = e.data || {};
  const delay = f.recv && d.t ? Math.max(0, f.recv - d.t) : null;
  const what = e.type === 'place' ? `<b class="mono">${esc(e.part)}</b> → 台車 <b>${esc(e.cart || '-')}</b> @ <b>${esc(e.loc)}</b>${d.from ? `<div class="small mute">移し替え(${esc(d.from)} から)</div>` : ''}` : e.type === 'cart' ? `台車 <b>${esc(e.cart)}</b> を <b>${esc(e.loc)}</b> へ移動` : e.type === 'ng' ? `<b style="color:var(--pri)">計画外を検知(未登録)</b> ${esc(e.part || '台車 ' + e.cart)} → ${esc(e.cart)} @ ${esc(e.loc)}<div class="small" style="color:var(--pri)">${(d.reasons || []).map(esc).join(' / ')}</div>` : e.type === 'status' ? `<b class="mono">${esc(e.part)}</b> を ${esc(d.to)}${d.reason ? '(' + esc(d.reason) + ')' : ''}`
    : e.type === 'alert' ? `優先アラートを現場へ: <b class="mono">${esc(e.part)}</b>` : e.type === 'ack' ? `アラートを了解: <b class="mono">${esc(e.part)}</b>` : e.type === 'hello' ? '端末が接続' : e.type === 'reset' ? '<b>デモをリセット</b>(登録の記録を消去)' : esc(e.type);
  const dir = f.out || e.device === PC_NAME() ? 'out' : 'in';
  return `<div class="fr ${dir} ${d.pri ? 'p' : ''} ${f.recv && Date.now() - f.recv < 5000 ? 'new' : ''}"><span class="fr-t">${hms(e.at)}</span>
    <span class="fr-d">${dir === 'out' ? '管理 → 現場' : esc(e.device) + ' →'}</span><span class="fr-w">${what}${d.pri ? ' <span class="pri">優先</span>' : ''}${d.offPlan ? ' <span class="pri">計画外</span>' : ''}</span>
    <span class="fr-m">${e.bytes || eventRow(e).join('').length} B${delay !== null && delay < 120000 ? ` ・ 遅れ ${(delay / 1000).toFixed(1)}秒` : ''}${f.ms ? ` ・ 送信 ${(f.ms / 1000).toFixed(1)}秒` : ''}</span></div>`;
}
// 通信の流れのアニメーション: 端末 → Google → この画面(アラートは逆向き)
function animateFlow(e, out) {
  if (VIEW !== 'dash') return;
  const lanes = out ? ['lane2', 'lane1'] : ['lane1', 'lane2'];
  const label = e.type === 'place' ? `${e.part} → ${e.cart ? e.cart + ' @ ' : ''}${e.loc}` : e.type === 'cart' ? `台車 ${e.cart} → ${e.loc}` : e.type === 'ng' ? `⚠ 計画外 ${e.part || e.cart}` : e.type === 'status' ? `${e.part} ${e.data.to}` : e.type === 'alert' ? `優先アラート ${e.part}` : e.type === 'ack' ? `了解 ${e.part}` : '接続';
  const cls = (e.data || {}).pri || e.type === 'alert' || e.type === 'ng' ? 'p' : e.type === 'ack' ? 'a' : '';
  lanes.forEach((id, k) => setTimeout(() => {
    const lane = $(id); if (!lane) return;
    const p = document.createElement('div'); p.className = 'packet ' + cls; p.textContent = label; lane.appendChild(p);
    const w = lane.clientWidth - p.offsetWidth;
    p.animate(out ? [{ transform: `translateX(${w}px)`, opacity: 1 }, { transform: 'translateX(0)', opacity: 1 }] : [{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${w}px)`, opacity: 1 }], { duration: 900, easing: 'ease-in-out' }).onfinish = () => p.remove();
    const node = $(k === 0 ? 'fn-g' : out ? 'fn-dev' : 'fn-pc'); if (node) setTimeout(() => { node.classList.remove('hit'); void node.offsetWidth; node.classList.add('hit'); }, 880);
  }, k * 950));
}

    ${Object.keys(MAST.plans || {}).length ? '' : '<button class="btn primary" onclick="seedPlan()">仮の計画を入れる(デモ)</button>'}</div>
  <div class="card sect"><h2>計画を入れる・変える</h2><div class="row">
    <input type="text" id="p_part" placeholder="品番" list="ppl" style="width:160px"><datalist id="ppl">${parts.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <input type="text" id="p_cart" placeholder="台車 例: C-01" style="width:140px"><input type="text" id="p_loc" placeholder="置き場所 例: T-01/K-N" style="width:170px"><input type="text" id="p_memo" placeholder="メモ" style="width:140px">
    <button class="btn primary" onclick="addPlan()">保存</button><span class="mute small">同じ品番を保存すると上書きされます</span></div></div>
  <div class="card flush"><table class="tbl"><thead><tr><th>品番</th><th>品名</th><th>計画の台車</th><th>計画の置き場所</th><th>メモ</th><th>いまの状態</th><th></th></tr></thead><tbody>
  ${parts.map(p => { const pl = (MAST.plans || {})[p]; const st = its(p).map(i => !placed(i) ? '<span class="mute">未配置</span>' : offPlan(i).length ? `<b style="color:var(--pri)">✗ ${esc(whereOf(i))}</b>` : `<span style="color:var(--ok)">✓ ${esc(whereOf(i))}</span>`).join('<br>');
    return `<tr class="${its(p).some(i => offPlan(i).length) ? 'warnrow' : ''}"><td class="mono"><b>${esc(p)}</b></td><td>${esc(name(p))}</td><td class="mono">${pl ? esc(pl.carts.join('・')) || '<span class="mute">指定なし</span>' : '<span class="mute">-</span>'}</td><td class="mono">${pl ? esc(pl.locs.join('・')) || '<span class="mute">指定なし</span>' : '<span class="mute">-</span>'}</td><td class="small">${pl ? esc(pl.memo) : ''}</td><td class="small">${st}</td>
      <td><button class="btn" onclick="editPlan('${esc(p)}')">変更</button></td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">まだありません</td></tr>'}
  </tbody></table></div>
  ${carts.length ? `<section class="card sect" style="margin-top:16px"><h2>台車ごとの移動で使う計画</h2><div class="mute small" style="margin-bottom:6px">台車を置いてよい場所 = その台車に載せる計画の部品の置き場所</div><table class="kv"><tbody>${carts.map(c => `<tr><th class="mono">${esc(c.code)}</th><td class="mono">${esc(cartPlanLocs(MAST, c.code).join('・'))}</td></tr>`).join('')}</tbody></table></section>` : ''}`;
};
function editPlan(p) { const pl = (MAST.plans || {})[p] || { carts: [], locs: [], memo: '' }; $('p_part').value = p; $('p_cart').value = pl.carts.join('/'); $('p_loc').value = pl.locs.join('/'); $('p_memo').value = pl.memo; $('p_cart').focus(); }
async function addPlan() {
  const part = $('p_part').value.trim().toUpperCase(); if (!part) return toast('品番を入れてください', true);
  const up = v => v.trim().toUpperCase();
  try { await ensureTabs(); await appendRows('plans', [[part, up($('p_cart').value), up($('p_loc').value), $('p_memo').value.trim()]]); MAST = await readMasters(); rebuild(); toast('保存しました(現場のスマホには1分以内に届きます)'); render(); } catch (e) { toast(e.message, true); }
}
async function seedPlan() {
  try { await ensureTabs(); await appendRows('plans', DEMO_PLAN); MAST = await readMasters(); rebuild(); toast('仮の計画を入れました'); render(); } catch (e) { toast(e.message, true); }
}

/* ---------------- 現場端末 ---------------- */
function fieldUrl() { const base = location.href.replace(/[^/]*(\?.*)?(#.*)?$/, ''); return `${base}index.html?c=${encodeURIComponent(CONF.clientId)}&s=${encodeURIComponent(CONF.sheetId)}`; }
VIEWS.devices = () => {
  const devs = Object.values(ST.devices).sort((a, b) => b.lastT - a.lastT);
  return `<div class="head"><h1>現場端末</h1></div>
  <div class="grid2"><section class="card"><h2>スマホを追加する</h2>
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div data-qr="${esc(fieldUrl())}" style="width:170px;height:170px;flex:none"></div>
    <div class="small"><p style="margin-top:0">スマホのカメラでこのQRを読み、現場アプリを開いてください。利用を許可されたGoogleアカウントでログインすると使えます。</p>
    <p>スマホにアプリを入れる必要はありません。ブラウザの「ホーム画面に追加」をすると、アプリのように開けます。</p></div></div></section>
    <section class="card"><h2>しくみ</h2><table class="kv"><tbody>
      <tr><th>現場のスマホ</th><td>カメラでタグを読み取り(端末の中で処理)、結果だけを送る</td></tr>
      <tr><th>Google</th><td>結果をスプレッドシートにためる。共有された人しか読み書きできない</td></tr>
      <tr><th>この管理画面</th><td>2.5秒ごとに新しい結果だけを読み、置き場マップを更新。優先アラートを現場へ送る</td></tr>
      <tr><th>通信が切れたら</th><td>スマホが結果をためておき、つながったら自動で送る</td></tr></tbody></table></section></div>
  <section class="card flush" style="margin-top:16px"><table class="tbl"><thead><tr><th>端末</th><th>状態</th><th>アカウント</th><th>最終連絡</th><th>送った件数</th><th>送信待ち</th></tr></thead><tbody>
  ${devs.map(d => `<tr><td><b>${esc(d.name)}</b></td><td>${Date.now() - d.lastT < 120000 ? '<span class="ok">● 接続中</span>' : '<span class="mute">○ 未接続</span>'}</td><td class="small">${esc(d.account)}</td><td class="small">${esc(d.last)}</td><td class="num">${d.n}</td><td class="num">${d.info && d.info.pending ? d.info.pending : 0}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">まだありません</td></tr>'}
  </tbody></table></section>`;
};

/* ---------------- 設定 ---------------- */
VIEWS.setup = () => `<div class="head"><h1>設定</h1></div>
  <section class="card sect"><table class="kv"><tbody>
    <tr><th>ログイン</th><td>${esc(ACCOUNT.email)} <button class="btn" onclick="logout()">ログアウト</button></td></tr>
    <tr><th>スプレッドシート</th><td><a href="https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONF.sheetId)}" target="_blank" rel="noopener">開く</a> <span class="mono small mute">${esc(CONF.sheetId)}</span></td></tr>
    <tr><th>クライアントID</th><td class="mono small">${esc(CONF.clientId)}</td></tr>
    <tr><th>通信回数</th><td class="small">この画面を開いてから ${NET.calls} 回(Googleの上限は1分あたり60回/人。スマホとPCは別のアカウントにすると余裕があります)</td></tr>
  </tbody></table></section>
  <section class="card"><h2>デモ用データ</h2><div class="row"><button class="btn" onclick="seedDemo()">デモ用のタグ・台車・置き場所を作る</button><button class="btn danger" onclick="resetDemo()">デモをリセット(登録の記録を消す)</button></div></section>`;

/* ---------------- デモ用データ ---------------- */
async function seedDemo() {
  const T = [['IHF-30112-A', 'タービンブレード 1段', 'L2610-03', 12, 1], ['IHF-30113-A', 'タービンブレード 2段', 'L2610-04', 8, 0], ['IHF-41005-C', '燃料ノズル', 'J2610-21', 4, 0],
    ['IHF-52001-D', 'ベアリング No.3', 'R2610-15', 2, 1], ['IHF-60340-A', 'シールリング', 'J2610-22', 30, 0], ['IHF-70015-B', '点火プラグ', 'J2610-23', 6, 0],
    ['HW-10011-M6', '六角ボルト M6', 'B2610-01', 200, 0], ['HW-10530-S', 'ロックワイヤ', 'B2610-07', 20, 0]];
  const L = [['T-01', '仮置き', '入荷口 左', ''], ['T-02', '仮置き', '入荷口 右', ''], ['TP-01', '仮置き', '優先仮置き', '○'], ['K-N', '検査エリア', '通常品置き場', ''], ['K-P', '検査エリア', '優先品置き場', '○']];
  const C = [['C-01', '通常台車1', ''], ['C-02', '通常台車2', ''], ['CP-01', '優先台車1', '○']];
  let max = Math.max(0, ...Object.keys(MAST.tags).map(k => +k.replace(/\D/g, '') || 0));
  try {
    await ensureTabs();
    await appendRows('tags', T.map(([p, n, l, q, pr]) => [`T${pad(++max, 4)}`, p, n, l, String(q), pr ? '優先' : '', now()]));
    const have = new Set([...Object.keys(MAST.locs), ...Object.keys(MAST.carts || {})]);
    const nl = L.filter(l => !have.has(l[0])); if (nl.length) await appendRows('locs', nl);
    const nc = C.filter(c => !have.has(c[0])); if (nc.length) await appendRows('carts', nc);
    if (!Object.keys(MAST.plans || {}).length) await appendRows('plans', DEMO_PLAN);
    MAST = await readMasters(); rebuild(); toast('デモ用のタグ・台車・置き場所を作りました'); location.hash = '#tags'; render();
  } catch (e) { toast(e.message, true); }
}
boot();
</script>
